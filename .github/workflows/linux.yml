# The Skateboard's simulator gate on Linux, CPU-only: replay a saved-stroke
# .usda through the pipeline to MESH (curvenet is CPU in the guest, no
# RenderingDevice), so it runs headless with no GPU/lavapipe. The committed
# Linux sandbox .so and guest ELFs are used as-is; nothing is rebuilt.
name: linux
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  GODOT_VERSION: 4.7.2
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -oq godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import
        run: timeout 300 "$GODOT" --headless --path . --import || true
      - name: Load probe (curvenet.elf + usd.elf)
        run: GODOT="$GODOT" bash tools/test.sh
      - name: Saved-stroke replay gate (skirt.usda)
        run: |
          timeout 300 "$GODOT" --headless --path . --xr-mode off --script tools/gate_replay.gd -- \
            --strokes=tools/strokes/skirt.usda --out=replay.txt --wallclock=240
          echo "--- replay.txt ---"; cat replay.txt
          grep -q "RESULT: PASS" replay.txt
